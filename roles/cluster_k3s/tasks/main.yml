- name: Create k3s state directories on the NVMe /home volume
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ cluster_k3s_state_dir }}/rancher"
    - "{{ cluster_k3s_state_dir }}/kubelet"
    - /var/lib/rancher
    - /var/lib/kubelet
    - /etc/rancher/k3s

- name: Bind-mount k3s state over /var/lib (/var is only 12 GB)
  become: true
  become_user: root
  ansible.posix.mount:
    src: "{{ cluster_k3s_state_dir }}/{{ item }}"
    path: "/var/lib/{{ item }}"
    fstype: none
    opts: bind
    state: mounted
  loop: [rancher, kubelet]

- name: Write k3s config
  become: true
  become_user: root
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    owner: root
    group: root
  register: cluster_k3s_config

- name: Check installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: cluster_k3s_current
  failed_when: false
  changed_when: false

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: cluster_k3s_version not in (cluster_k3s_current.stdout | default(''))

- name: Install k3s
  become: true
  become_user: root
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ cluster_k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  when: cluster_k3s_version not in (cluster_k3s_current.stdout | default(''))
  changed_when: true

- name: Create k3s drop-in dir
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"

- name: Order k3s after ZFS pool import
  become: true
  become_user: root
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/zfs.conf
    content: |
      [Unit]
      After=zfs-import.target zfs-mount.service
      Wants=zfs-import.target
    mode: "0644"
    owner: root
    group: root
  register: cluster_k3s_dropin

- name: Enable and (re)start k3s
  become: true
  become_user: root
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: "{{ 'restarted' if (cluster_k3s_config.changed or cluster_k3s_dropin.changed) else 'started' }}"
    daemon_reload: true

- name: Wait for the node to be Ready
  become: true
  become_user: root
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ cluster_k3s_node_name }} --timeout=180s
  changed_when: false

- name: Fetch kubeconfig to the controller
  become: true
  become_user: root
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: cluster_k3s_kubeconfig_raw

- name: Ensure the local kubeconfig directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ cluster_k3s_kubeconfig_local | dirname }}"
    state: directory
    mode: "0700"

- name: Write local kubeconfig
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    dest: "{{ cluster_k3s_kubeconfig_local }}"
    content: "{{ cluster_k3s_kubeconfig_raw.content | b64decode | replace('127.0.0.1', cluster_k3s_node_ip)
      | regex_replace('(?m)(: )default$', '\\1' ~ site_name) }}"
    mode: "0600"

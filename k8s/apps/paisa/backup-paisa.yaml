apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: paisa
  namespace: paisa
spec:
  sourcePVC: paisa
  trigger:
    schedule: "0 */6 * * *"
  restic:
    repository: restic-paisa
    copyMethod: Snapshot
    volumeSnapshotClassName: zfs
    storageClassName: zfs
    accessModes: [ReadWriteOnce]
    pruneIntervalDays: 7
    cacheCapacity: 2Gi
    retain:
      daily: 7
      weekly: 4
      monthly: 6

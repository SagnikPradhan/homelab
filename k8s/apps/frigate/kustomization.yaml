apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - backup-frigate-config.yaml
  - backup-frigate-media.yaml
configMapGenerator:
  - name: frigate-config-seed
    namespace: frigate
    files: [config.yml]
generatorOptions:
  disableNameSuffixHash: true

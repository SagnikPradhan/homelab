apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: monitoring }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostNetwork: true
      hostPID: true
      enableServiceLinks: false
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          args:
            - --path.rootfs=/host
            - --web.listen-address=:9100
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/(rancher|kubelet)|var/lib/docker)($|/)
          ports: [{ containerPort: 9100, hostPort: 9100 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          volumeMounts: [{ name: root, mountPath: /host, readOnly: true, mountPropagation: HostToContainer }]
      volumes: [{ name: root, hostPath: { path: / } }]

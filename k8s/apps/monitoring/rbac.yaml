# Lets VictoriaMetrics discover nodes and scrape the kubelet/cAdvisor through the API server.
apiVersion: v1
kind: ServiceAccount
metadata: { name: victoria-metrics, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: victoria-metrics }
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: victoria-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: victoria-metrics }
subjects: [{ kind: ServiceAccount, name: victoria-metrics, namespace: monitoring }]

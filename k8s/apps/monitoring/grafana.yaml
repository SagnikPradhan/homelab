apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: monitoring }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.monitoring.svc.cluster.local:8428
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: monitoring }
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: homelab
        folder: Homelab
        type: file
        allowUiUpdates: false
        updateIntervalSeconds: 60
        options: { path: /etc/grafana/dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      enableServiceLinks: false
      securityContext: { fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana, key: admin_password } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 } }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana }
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          # generated from dashboards/*.json (kustomization.yaml)
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  # LAN access on the node IP, port 3000
  type: LoadBalancer
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]

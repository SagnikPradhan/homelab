apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  sourcePVC: home-assistant
  trigger:
    schedule: "0 */6 * * *"
  restic:
    repository: restic-home-assistant
    # frozen ZFS snapshot => consistent SQLite/DB files
    copyMethod: Snapshot
    volumeSnapshotClassName: zfs
    storageClassName: zfs
    accessModes: [ReadWriteOnce]
    pruneIntervalDays: 7
    cacheCapacity: 2Gi
    retain:
      daily: 7
      weekly: 4
      monthly: 6

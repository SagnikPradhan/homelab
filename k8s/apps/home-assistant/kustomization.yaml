apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - backup-home-assistant.yaml
  - backup-mosquitto.yaml
configMapGenerator:
  - name: mosquitto-conf
    namespace: home-assistant
    files: [mosquitto.conf]
generatorOptions: { disableNameSuffixHash: true }

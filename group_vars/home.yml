site_name: home
# nodes 10.0.60.0/24, services .61, infra .62, pods 10.0.64.0/20
site_block: 60

cluster_k3s_node_ip: "10.0.60.200"
cluster_k3s_node_name: hserver-00

host_zfs_pool: tank
# 2 GiB cap on the read cache
host_zfs_arc_max_bytes: 2147483648
